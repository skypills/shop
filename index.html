<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <h2>Catalog</h2>
    <div id="catalog"></div>

    <h2>Cart</h2>
    <div id="cart"></div>

    <h2>Result:</h2>
    <div id="result"></div>

    <button id="pay">Pay</button>
</body>
<script>
    function addToCart(id){
        let product = catalog.find(item => item.id == id);
        if (product){
            product.countInCart++;
            if (!cart.includes(product)){
                cart.push(product);
            }
        }
        renderCart();
        result += product.price;
        renderPrice();
    }
    function renderCart(){
        cartContainer.innerHTML = ``;
        cart.map(elem => {
            cartContainer.innerHTML +=`
            <div class="product-item">
                <img src=${elem.images}>
                <p class="countOfItems">${elem.countInCart}</p>
                <h3>${elem.title}</h3>
                <p>price: ${elem.price}$</p>
            </div>
            `;
        });
    }
    function renderPrice(){
        resultContainer.innerHTML = ``;
        resultContainer.innerHTML +=`
        <div class="result">
            <h>Price to pay: ${result.toFixed(2)}$</h3>
        </div>
        `;
    }
    let catalogContainer = document.getElementById('catalog');
    let cartContainer = document.getElementById('cart');
    let resultContainer = document.getElementById('result');
    let cart = new Array;
    let countOfItem = 0;
    let result = 0;
    const catalog = [
        {id: 1, title: "Apple", price: 1.3, images: "images/apple.jpg", discription: "just apple", countInCart: 0},
        {id: 2, title: "Banana", price: 2.1, images: "images/banana.jpg", discription: "just banana", countInCart: 0},
        {id: 3, title: "Fish", price: 3.4, images: "images/fish.jpg", discription: "just fish", countInCart: 0},
        {id: 4, title: "Milk", price: 2.4, images: "images/milk.jpg", discription: "just milk", countInCart: 0},
        {id: 5, title: "Blueberry", price: 0.7, images: "images/blueberry.jpg", discription: "just blueberry", countInCart: 0}
    ];
    catalog.map(elem => {
        catalogContainer.innerHTML +=`
        <div class="product-item">
            <img src=${elem.images}>
            <h3>${elem.title}</h3>
            <p>Discription: ${elem.discription}</p>
            <p>price: ${elem.price}$</p>
            <button onclick=addToCart(${elem.id})>Add to cart</button>
        </div>
        `;
    });
</script>
</html>
